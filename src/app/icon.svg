<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="100" height="100" rx="18" fill="#0a0a0a"/>
  <g fill="#f87171">
    <!-- 5x7 pixel "G": pixel stride 12, draw size 11 (1px gap), grid origin x=20 y=8 -->
    <!-- row 0 -->
    <rect x="32" y="8" width="11" height="11"/>
    <rect x="44" y="8" width="11" height="11"/>
    <rect x="56" y="8" width="11" height="11"/>
    <!-- row 1 -->
    <rect x="20" y="20" width="11" height="11"/>
    <rect x="68" y="20" width="11" height="11"/>
    <!-- row 2 -->
    <rect x="20" y="32" width="11" height="11"/>
    <!-- row 3 (inner spur) -->
    <rect x="20" y="44" width="11" height="11"/>
    <rect x="44" y="44" width="11" height="11"/>
    <rect x="56" y="44" width="11" height="11"/>
    <rect x="68" y="44" width="11" height="11"/>
    <!-- row 4 -->
    <rect x="20" y="56" width="11" height="11"/>
    <rect x="68" y="56" width="11" height="11"/>
    <!-- row 5 -->
    <rect x="20" y="68" width="11" height="11"/>
    <rect x="68" y="68" width="11" height="11"/>
    <!-- row 6 -->
    <rect x="32" y="80" width="11" height="11"/>
    <rect x="44" y="80" width="11" height="11"/>
    <rect x="56" y="80" width="11" height="11"/>
  </g>
</svg>
